ce,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b9199">drawTri()</text><text x="824" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#1a1d21">Activation decays by α at each hop.</text><text x="824" y="205" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">drawTri() receives nothing. There is no</text><text x="824" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">edge that reaches it.</text><text x="824" y="290" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">α = 0.85</text><text x="40" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b9199">Model parameters are the published defaults. Activations and cue strengths are illustrative; gate values are computed.</text></svg>