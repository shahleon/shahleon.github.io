<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Seed activation from the individual"><rect width="1280" height="720" fill="#ffffff"/><text x="40" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#1f6feb" letter-spacing="1.4">PASS A · COVERAGE · STEP 2 OF 10</text><text x="40" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="27" font-weight="600" fill="#1a1d21">Seed activation from the individual</text><text x="40" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#8b9199">Stage 1, using only what this programmer has done.</text><line x1="150" y1="372" x2="330" y2="268" stroke="#d4d8dd" stroke-width="1.7" opacity=".85"/><line x1="150" y1="372" x2="330" y2="476" stroke="#d4d8dd" stroke-width="1.7" opacity=".85"/><line x1="330" y1="268" x2="500" y2="214" stroke="#d4d8dd" stroke-width="1.7" opacity=".85"/><line x1="330" y1="476" x2="500" y2="420" stroke="#d4d8dd" stroke-width="1.7" opacity=".85"/><line x1="330" y1="268" x2="500" y2="420" stroke="#d4d8dd" stroke-width="1.7" opacity=".85"/><rect x="84" y="350" width="132" height="44" rx="8" fill="#e8f0fe" stroke="#1f6feb" stroke-width="2.8"/><text x="150" y="378" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#1a1d21">render()</text><rect x="264" y="246" width="132" height="44" rx="8" fill="#ffffff" stroke="#d4d8dd" stroke-width="1.6"/><text x="330" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#1a1d21">layout()</text><rect x="264" y="454" width="132" height="44" rx="8" fill="#ffffff" stroke="#d4d8dd" stroke-width="1.6"/><text x="330" y="482" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#1a1d21">paint()</text><rect x="434" y="192" width="132" height="44" rx="8" fill="#ffffff" stroke="#d4d8dd" stroke-width="1.6"/><text x="500" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#1a1d21">shape()</text><rect x="434" y="398" width="132" height="44" rx="8" fill="#ffffff" stroke="#d4d8dd" stroke-width="1.6"/><text x="500" y="426" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#1a1d21">fill()</text><rect x="622" y="308" width="132" height="44" rx="8" fill="#ffffff" stroke="#d4d8dd" stroke-width="1.6" stroke-dasharray="5 4"/><text x="688" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#8b9199">drawTri()</text><text x="824" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#1a1d21">A₀(mₜ) = 1</text><text x="824" y="205" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">The recent path is seeded by recency,</text><text x="824" y="230" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">decayed by β.</text><text x="824" y="290" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">β = 0.9</text><text x="40" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b9199">Model parameters are the published defaults. Activations and cue strengths are illustrative; gate values are computed.</text></svg>