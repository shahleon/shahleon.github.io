<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Support is the weighted sum of two cue types"><rect width="1280" height="720" fill="#ffffff"/><text x="40" y="52" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" fill="#1f6feb" letter-spacing="1.4">PASS B · THE GATE · STEP 1 OF 4</text><text x="40" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="27" font-weight="600" fill="#1a1d21">Support is the weighted sum of two cue types</text><text x="40" y="112" font-family="system-ui,-apple-system,sans-serif" font-size="17" fill="#8b9199">Both weights default to 1, so neither type dominates.</text><text x="40" y="200" font-family="ui-monospace,Menlo,monospace" font-size="26" fill="#1a1d21">S(r) = wₑ·E(r) + wᵢ·I(r)</text><text x="824" y="270" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#1a1d21">E(r) is the normalised strength of direct mentions.</text><text x="824" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">Sparse, but high impact.</text><text x="824" y="320" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21"></text><text x="824" y="345" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">I(r) is the strength from teammates' recent</text><text x="824" y="370" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">navigation. Broader coverage, weaker per event.</text><text x="824" y="470" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">wₑ = 1</text><text x="928" y="470" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">wᵢ = 1</text><text x="40" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b9199">Model parameters are the published defaults. Activations and cue strengths are illustrative; gate values are computed.</text></svg>