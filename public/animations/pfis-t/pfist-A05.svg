ese edges decay unless reinforced.</text><text x="40" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b9199">Model parameters are the published defaults. Activations and cue strengths are illustrative; gate values are computed.</text></svg>