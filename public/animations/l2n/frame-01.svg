ospace" font-size="15" fill="#8b9199">0.31</text><text x="898" y="240" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#1a1d21">Method</text><rect x="910" y="226" width="268" height="19" rx="3" fill="#f4f5f7"/><rect x="910" y="226" width="117.9" height="19" rx="3" fill="#1f6feb" opacity="0.85"/><text x="1190" y="240" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">0.44</text><text x="898" y="280" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#1a1d21">File</text><rect x="910" y="266" width="268" height="19" rx="3" fill="#f4f5f7"/><rect x="910" y="266" width="147.4" height="19" rx="3" fill="#1f6feb" opacity="0.85"/><text x="1190" y="280" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">0.55</text><text x="898" y="320" text-anchor="end" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#1a1d21">Path</text><rect x="910" y="306" width="268" height="19" rx="3" fill="#f4f5f7"/><rect x="910" y="306" width="75.0" height="19" rx="3" fill="#1f6feb" opacity="0.85"/><text x="1190" y="320" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#8b9199">0.28</text><text x="824" y="476" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="600" fill="#1a1d21">H(n) = wᵀ · f(n)</text><text x="824" y="502" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">Weights start random in [0,1]⁵.</text><text x="824" y="528" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="400" fill="#1a1d21">The beam holds only the entry point.</text><text x="40" y="698" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#8b9199">Illustrative values. Beam width 3 shown for legibility; experiments used 5.</text></svg>