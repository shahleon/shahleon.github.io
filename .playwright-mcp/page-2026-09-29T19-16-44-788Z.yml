          - 'heading "Learning to Navigate (L2N): A Human-Centered Framework for Local Code Search" [level=3] [ref=f1e34]'
          - paragraph [ref=f1e35]: HCII 2026
          - paragraph [ref=f1e36]: L2N represents a codebase as a directed graph of methods and files and searches it with beam search guided by a heuristic learned for that specific repository. A structured-perceptron training procedure updates feature weights across repository-specific training pairs until the weights converge.
          - paragraph [ref=f1e37]: On large repositories, mean reciprocal rank of the relevant function rose from 0.55 to 0.94, beating Lucene and both zero-shot and fine-tuned UniXcoder across six open-source Python repositories. The advantage widened as repositories grew.
          - generic [ref=f1e38]: Weight-learning animation
