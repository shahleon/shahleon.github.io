        - generic [ref=f1e45]:
          - generic [ref=f1e46]: Social
          - 'heading "What Teams Seek and How They Seek It: Understanding Foraging Diets in Collaborative Software Debugging" [level=3] [ref=f1e48]'
          - paragraph [ref=f1e49]: HCII 2026
          - paragraph [ref=f1e50]: Ten three-person teams debugged a real defect in the open-source reference manager JabRef while we recorded their navigation and communication. The study extended information-goal and foraging-strategy taxonomies from individual to team-level goals and behaviors.
          - paragraph [ref=f1e51]: 36.1% of coded strategy events served team-originating goals, showing that collaboration is a persistent layer of debugging activity rather than overhead on individual work.
          - generic [ref=f1e52]: Study figure
          - link "DOI" [ref=f1e55] [cursor=pointer]:
            - /url: https://doi.org/10.1007/978-3-032-30781-1_17
        - generic [ref=f1e58]:
          - generic [ref=f1e59]:
            - generic [ref=f1e60]: Social
            - generic [ref=f1e61]: Best Paper Honorable Mention
          - heading "Where Will They Click Next? A Social Foraging Model for Collaborating Teams" [level=3] [ref=f1e62]
          - paragraph [ref=f1e63]: CHI 2026
          - paragraph [ref=f1e64]: PFIS-T predicts a developer's next navigation from teammates' recent navigation (implicit cues that decay over time) and from code mentioned in team conversation (explicit cues). It is the first computational model to predict social information foraging step by step during synchronous teamwork.
          - paragraph [ref=f1e65]: Predicted 81.5% of navigations across ten teams, covering up to 57.1% more steps than the strongest individual baseline. The rate of steps the model could not predict at all fell from 33.63% to 21.06%, and fell for nine of ten teams.
          - generic [ref=f1e66]: Social scent animation
          - generic [ref=f1e68]:
            - link "DOI" [ref=f1e69] [cursor=pointer]:
              - /url: https://doi.org/10.1145/3772318.3791506
            - link "Replication package" [ref=f1e70] [cursor=pointer]:
              - /url: https://doi.org/10.5281/zenodo.18459372
        - generic [ref=f1e73]:
          - generic [ref=f1e74]: Collective
          - 'heading "The Power of the Collective: Cross-Session Behavioral Priors for Developer Navigation Prediction" [level=3] [ref=f1e76]'
          - paragraph [ref=f1e77]: VL/HCC 2026 (to appear)
          - paragraph [ref=f1e78]: A Markov transition model built from prior teams' traces predicts a new team's navigation from its very first step, before any session history accumulates. Call-graph expansion of the candidates extends reach beyond what was directly observed by prior teams.
          - paragraph [ref=f1e79]: Hit@10 of 0.804, against 0.659 for PFIS-T on the same steps. Four prior teams were sufficient. The prior runs in under 10 ms, compared to a median of 153 seconds per step for the 32B local LLM.
          - generic [ref=f1e80]: Collective pipeline figure
          - link "Replication package" [ref=f1e83] [cursor=pointer]:
